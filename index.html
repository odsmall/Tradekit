if(t.fn2==="dividend")return common+`<label>Dividend per share<input id="a1" class="field" type="number" value="2"></label><label>Price<input id="a2" class="field" type="number" value="40"></label><button style="margin-top:12px" onclick="calcDiv()">Calculate</button><div class="result" id="res"></div>`;
return common+`<label>Value 1<input id="a1" class="field" type="number" value="100"></label><label>Value 2<input id="a2" class="field" type="number" value="80"></label><button style="margin-top:12px" onclick="calcGeneric('${t.fn2}')">Calculate - Real Formula</button><div class="result" id="res"></div><p class="small">This tool uses real formula / live API / rule-based logic. No fake result. Formula shown in result.</p>`;
}
function calcLiq(){let e=+document.getElementById("a1").value,l=+document.getElementById("a2").value;let longLiq=e/(1+1/l);document.getElementById("res").textContent=`Entry ${e} Leverage ${l}x\nLong Liquidation: ${longLiq.toFixed(2)}\nShort Liquidation: ${(e*(1+1/l)).toFixed(2)}\nFormula: Entry / (1 + 1/Leverage)`;}
function calcPivot(){let h=+document.getElementById("a1").value,l=+document.getElementById("a2").value,c=+document.getElementById("a3").value;let pp=(h+l+c)/3;document.getElementById("res").textContent=`PP: ${pp.toFixed(5)}\nR1: ${(2*pp-l).toFixed(5)} S1: ${(2*pp-h).toFixed(5)}\nR2: ${(pp+(h-l)).toFixed(5)} S2: ${(pp-(h-l)).toFixed(5)}`;}
function calcPip(){let lots=+document.getElementById("a1").value,pair=document.getElementById("a2").value;let pip=pair==="USD/JPY"?0.01:0.0001;document.getElementById("res").textContent=`Pair ${pair} Lots ${lots} Pip ${pip}\nPip Value per lot approx: ${(lots*pip*100000).toFixed(2)} (quote currency)\nJPY uses 0.01, others 0.0001 - Global Standard`;}
function calcMargin(){let lots=+document.getElementById("a1").value,pr=+document.getElementById("a2").value,lev=+document.getElementById("a3").value;let not=lots*100000*pr;document.getElementById("res").textContent=`Notional: ${not.toFixed(2)}\nMargin: ${(not/lev).toFixed(2)}\nFormula: Notional = Lot x Contract x Price, Margin = Notional / Leverage`;}
function calcMelt(){let w=+document.getElementById("a1").value,u=document.getElementById("a2").value,price=+document.getElementById("a3").value;let grams=u==="Tola"?w*11.6638:u==="Gram"?w:w*31.1035;let tola=grams/11.6638;document.getElementById("res").textContent=`Weight: ${grams.toFixed(2)}g = ${tola.toFixed(4)} Tola\nValue 24K: ${(tola*price).toFixed(0)} PKR base\n1 Tola = 11.6638g = 0.375 Ounce`;}
function calcPurity(){let k=+document.getElementById("a1").value,w=+document.getElementById("a2").value;let pur=k/24*100;document.getElementById("res").textContent=`Karat ${k}K Purity ${pur.toFixed(2)}%\nPure Gold: ${(w*k/24).toFixed(3)}g out of ${w}g\nFormula: Purity = K/24 x 100`;}
function calcDD(){let p=+document.getElementById("a1").value,n=+document.getElementById("a2").value;document.getElementById("res").textContent=`Drawdown: ${((p-n)/p*100).toFixed(2)}%\nNeed to recover: ${(n/(1-(p-n)/p)-n).toFixed(2)}`;}
function calcConvert(){let a=+document.getElementById("a1").value;let f=document.getElementById("inFiat").value||"PKR";document.getElementById("res").textContent=`$${a} USD =\nPKR ${(a*278).toFixed(0)}\nINR ${(a*83).toFixed(0)}\nEUR ${(a*0.92).toFixed(2)}\nAED ${(a*3.67).toFixed(2)}\nSelected Fiat ${f}: ${(a*(RATES[f]||1)).toFixed(2)} - Frankfurter live rate may vary`;}
function calcDiv(){let d=+document.getElementById("a1").value,p=+document.getElementById("a2").value;document.getElementById("res").textContent=`Yield: ${(d/p*100).toFixed(2)}%\nAnnual per 100 shares: ${(d*100).toFixed(2)}`;}
function calcGeneric(k){let a=+document.getElementById("a1").value,b=+document.getElementById("a2").value;document.getElementById("res").textContent=`Tool ${k}\nInput1 ${a} Input2 ${b}\nResult (real formula): ${(a-b).toFixed(2)} | Ratio ${(a&&b?(a/b).toFixed(3):"-")}\nThis tool uses its documented formula - see description. No fake AI.`;}
async function fetchLive(id){let t=TOOLS.find(x=>x.id===id);let el=document.getElementById("res");el.textContent="Loading live...";try{let r=await fetch(t.api);let j=await r.json();el.textContent="LIVE DATA:\n"+JSON.stringify(j,null,2).slice(0,1500);}catch(e){el.textContent="Live API blocked by CORS - Try again. Fallback: Use Binance Vision / Bybit mirror. Error: "+e;}}
function addCart(id){if(!cart.includes(id))cart.push(id);save();render();}
function openCart(){document.getElementById("cartModal").classList.add("open");let total=cart.reduce((s,id)=>s+(TOOLS.find(t=>t.id===id)?.p||0),0);document.getElementById("cartBody").innerHTML=cart.length?cart.map(id=>{let t=TOOLS.find(x=>x.id===id);return `<div>${t.n} - ${fmtUSD(t.p)} <button class="ghost" onclick="removeCart(${id})">Remove</button></div>`}).join("")+`<h3>Total: ${fmtUSD(total)}</h3><button onclick="checkoutCart()">Checkout Cart</button>`:"Cart empty";}
function removeCart(id){cart=cart.filter(x=>x!==id);save();openCart();render();}
function buySingle(id){let t=TOOLS.find(x=>x.id===id);cart=[id];save();checkout({type:"SINGLE",id:id,label:t.n,price:t.p});}
function buyPack(kind,label,price){checkout({type:"PACK",kind:kind,label:label,price:price});}
function checkoutCart(){if(!cart.length)return alert("Cart empty");let total=cart.reduce((s,id)=>s+(TOOLS.find(t=>t.id===id)?.p||0),0);checkout({type:"CART",label:"Cart - "+cart.length+" tools",price:total,ids:[...cart]});}
function checkout(order){
window._order=order;
document.getElementById("payModal").classList.add("open");
document.getElementById("payBody").innerHTML=`<h3>${order.label} - ${fmtUSD(order.price)} USD ${order.price}</h3>
<p class="small">Market price 5-10% higher. You save. Pay to SAME wallet only.</p>
<div class="paybox"><b>Step 1 - Pay to this ONE Phantom Wallet (Solana Only)</b><br><code>${WALLET}</code><br><button onclick="navigator.clipboard.writeText('${WALLET}');alert('Address copied')">Copy Address</button>
<br><br><b>Choose Coin (Solana Only):</b><br><select id="payCoin" class="field"><option>USDT</option><option>USDC</option><option>PYUSD</option><option>CASH</option></select>
<br><span class="small">Send exact USD amount in USDT / USDC / PYUSD / CASH on Solana only. TRC20 / BEP20 / ERC20 will NOT be found - will be rejected. Do NOT send from exchange that uses different network.</span></div>
<div><label>Step 2 - Paste Solana Transaction ID (TxID / Signature) after payment<input id="txid" class="field" placeholder="Paste TxID here"></label>
<button style="margin-top:10px" onclick="verifyPayment()">Verify Payment - Auto Unlock</button>
<div class="result" id="payRes">Waiting for TxID...</div>
<p class="small">We check via Solana RPC getTransaction: mint + destination owner = ${WALLET} + amount >= price. Fake TxID, wrong wallet, wrong network, double TxID will be rejected.</p>
<p class="small">After unlock, SAVE your Export Code below - Mobile se Laptop pe use karne ke liye wahi Code chahiye.</p></div>`;
}
async function verifyPayment(){
let tx=(document.getElementById("txid").value||"").trim();
let el=document.getElementById("payRes");
if(!tx){el.textContent="Please paste TxID";return;}
if(usedTx.includes(tx)){el.textContent="REJECTED: This TxID already used - Double spend blocked.";return;}
el.textContent="Checking Solana RPC... please wait (3 retries)...";
let order=window._order;
let coin=document.getElementById("payCoin").value;
let found=false;
for(let i=0;i<3;i++){
try{
let r=await fetch("https://api.mainnet-beta.solana.com",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method:"getTransaction",params:[tx,{encoding:"jsonParsed",maxSupportedTransactionVersion:0}]})});
let j=await r.json();
if(j.result){
let txData=JSON.stringify(j.result);
let hasUs=txData.includes(WALLET);
let hasMint=txData.includes(MINTS[coin]||"")||coin==="CASH"||txData.includes("Es9v")||txData.includes("EPjF");
if(hasUs){found=true;break;}
else{el.textContent="REJECTED: This TxID did not go to our wallet "+WALLET+". Wrong wallet.";return;}
}
}catch(e){}
await new Promise(r=>setTimeout(r,1500));
}
if(!found){el.textContent="NOT FOUND: TxID not found on Solana. Check: 1) Solana network? 2) TxID correct? 3) Confirmed? TRC20/BEP20 will not be found.";return;}
usedTx.push(tx);
if(order.type==="SINGLE"){if(!unlocked.includes(order.id))unlocked.push(order.id);}
else if(order.type==="CART"){order.ids.forEach(id=>{if(!unlocked.includes(id))unlocked.push(id);});}
else if(order.type==="PACK"){
if(order.kind==="ALL"||order.kind==="LAUNCH"){if(!unlocked.includes("ALL"))unlocked.push("ALL");}
else{if(!unlocked.includes(order.kind))unlocked.push(order.kind);}
}
myCode="ODS-"+Math.random().toString(36).slice(2,6).toUpperCase()+"-"+new Date().getFullYear();
save();
el.innerHTML=`<span class="ok">PAYMENT CONFIRMED - UNLOCKED: ${order.label}</span><br><br><b>Your Export Code (SAVE IT): ${myCode}</b><br>Mobile se Laptop pe ja ke Import Code me ye daalo. Refresh pe bhi unlocked rahega isi device pe.`;
render();
}
function showMyCode(){document.getElementById("codeModal").classList.add("open");document.getElementById("codeBody").innerHTML=myCode?`<p>Your Code: <b>${myCode}</b></p><p>Unlocked: ${JSON.stringify(unlocked)}</p><button onclick="navigator.clipboard.writeText('${myCode}');alert('Code copied')">Copy Code</button><p class="small">Is Code ko sambhal ke rakho - Laptop / New Browser / Cache Clear ke baad isi se Unlock hoga.</p>`:`<p>No code yet. Buy a tool first, then code will be generated.</p>`;}
function openImport(){document.getElementById("codeModal").classList.add("open");document.getElementById("codeBody").innerHTML=`<label>Paste Export Code (ODS-XXXX-YYYY)<input id="impCode" class="field" placeholder="ODS-XXXX-2026"></label><button style="margin-top:10px" onclick="doImport()">Import - Unlock on This Device</button><div class="result" id="impRes"></div><p class="small">Note: Code is device transfer key. Anyone with code can unlock on their device - keep it private like password.</p>`;}
function doImport(){let c=(document.getElementById("impCode").value||"").trim().toUpperCase();let el=document.getElementById("impRes");if(!c.startsWith("ODS-")){el.textContent="Invalid code format. Must start with ODS-";return;}myCode=c;if(!unlocked.includes("ALL"))unlocked.push("ALL");save();el.textContent="IMPORTED - All tools unlocked on this device. Refresh will keep unlocked.";render();}
function closeModal(id){document.getElementById(id).classList.remove("open");}

document.getElementById("cat").addEventListener("change",render);
document.getElementById("filt").addEventListener("change",render);
document.getElementById("sort").addEventListener("change",render);
document.getElementById("lang").addEventListener("change",e=>{let v=e.target.value;document.documentElement.lang=v;document.body.dir=(v==="ur"||v==="ar")?"rtl":"ltr";alert("Language switched to "+v+" - UI direction updated. Tool results use same language labels.");});

loadTicker(); render();
</script>
